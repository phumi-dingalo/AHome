<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairytale Home 🌸🏡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap');

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(to top, #a8e6cf, #dcedc1);
    font-family: 'Mountains of Christmas', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Silhouette of couple */
  .silhouette {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 100px;
    height: 100px;
    background: black;
    border-radius: 0 0 50% 50%;
  }

  /* House parts */
  .house-part {
    position: absolute;
    width: 60px;
    height: 60px;
    cursor: pointer;
    border-radius: 8px;
    text-align: center;
    line-height: 60px;
    font-weight: bold;
    color: white;
    font-size: 1rem;
  }

  .roof { background: #ff4d4d; width: 80px; height: 40px; line-height: 40px; }
  .door { background: #ff9999; height: 60px; line-height: 60px; border-radius: 0; }
  .window { background: #ffd27f; width: 40px; height: 40px; line-height: 40px; }
  .wall { background: #ffa64d; height: 60px; line-height: 60px; }

  /* Message */
  .message {
    position: absolute;
    top: 40%;
    font-size: 2rem;
    text-align: center;
    opacity: 0;
    color: #fff;
    text-shadow: 2px 2px 5px #000;
    transition: opacity 1s, transform 0.5s;
  }

  .show {
    opacity: 1;
    transform: scale(1.3);
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    animation: sparkle 1s ease-out forwards;
  }

  @keyframes sparkle {
    from {opacity: 1; transform: scale(1);}
    to {opacity: 0; transform: scale(2);}
  }
</style>
</head>
<body>

<div id="roof" class="house-part roof">Roof</div>
<div id="door" class="house-part door">❤</div>
<div id="window1" class="house-part window">Win</div>
<div id="window2" class="house-part window">Win</div>
<div id="wall1" class="house-part wall">Wall</div>
<div id="wall2" class="house-part wall">Wall</div>

<div class="message" id="message">Will you build a home with me? 🏡💖</div>

<script>
const parts = document.querySelectorAll('.house-part');
const message = document.getElementById('message');
let caught = 0;

// Random start positions
parts.forEach(part => {
  part.style.left = Math.random() * (window.innerWidth - 80) + 'px';
  part.style.top = -50 + 'px';
});

// Make parts fall
function fall() {
  parts.forEach(part => {
    if (!part.caught) {
      let top = parseFloat(part.style.top);
      top += 2 + Math.random() * 2; // falling speed
      if (top > window.innerHeight) top = -50;
      part.style.top = top + 'px';
    }
  });
  requestAnimationFrame(fall);
}
fall();

// Catch parts on click
parts.forEach(part => {
  part.addEventListener('click', () => {
    if (!part.caught) {
      part.caught = true;
      part.style.display = 'none';
      createSparkles(part);
      caught++;
      if (caught === parts.length) {
        message.classList.add('show');
      }
    }
  });
});

// Sparkles
function createSparkles(el) {
  for (let i = 0; i < 15; i++) {
    const s = document.createElement('div');
    s.classList.add('sparkle');
    s.style.left = (parseFloat(el.style.left) + Math.random() * 60) + 'px';
    s.style.top = (parseFloat(el.style.top) + Math.random() * 60) + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
</script>

</body>
</html>
